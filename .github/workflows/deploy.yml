name: Deploy to elkmountainsoftware.com

on:
  push:
    branches: [ master ]
  workflow_dispatch:   # also allows manual trigger from GitHub Actions UI.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE__PROVIDER: SqlServer
      DATABASE__CONNECTIONSTRING: ${{ secrets.DB_CONNECTION_STRING }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore KOCRAsp/KOCRAsp.csproj

      - name: Publish (Release, framework-dependent)
        run: dotnet publish KOCRAsp/KOCRAsp.csproj -c Release --self-contained false -p:UseAppHost=false -o ./publish --nologo

      - name: Ensure logs directory
        run: mkdir -p ./publish/logs

      - name: Verify publish output
        run: |
          ls -la ./publish
          test -f ./publish/KOCRAsp.dll
          test -f ./publish/KOCRAsp.deps.json
          test -f ./publish/KOCRAsp.runtimeconfig.json

      # Writes production appsettings.json from GitHub Secrets. No secrets in committed files.
      - name: Write production appsettings.json
        env:
          AZURE_COGNITIVE_SERVICES_KEY: ${{ secrets.AZURE_COGNITIVE_SERVICES_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_DEFAULT_PRICE_ID: ${{ secrets.STRIPE_DEFAULT_PRICE_ID }}
          STRIPE_METER_EVENT_NAME: ${{ secrets.STRIPE_METER_EVENT_NAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          DATA_PROTECTION_KEY_XML: ${{ secrets.DATA_PROTECTION_KEY_XML }}
        run: |
          python3 << 'EOF'
          import json, os

          with open('./KOCRAsp/appsettings.json') as f:
              base = json.load(f)

          email = base.get("Email", {})
          stripe = base.get("Stripe", {})
          prod = {
            "AllowDuplicateEmails": True,
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "elkmountainsoftware.com;www.elkmountainsoftware.com;localhost;127.0.0.1",
            "Api": {
              "BaseUrl": "https://www.elkmountainsoftware.com"
            },
            "Kocr": {
              "BaseDirectory": "KOCRBase"
            },
            "AzureCognitiveServicesKey":      os.environ["AZURE_COGNITIVE_SERVICES_KEY"],
            "AzureCognitiveServicesEndpoint": base.get("AzureCognitiveServicesEndpoint"),
            "OCRProvider":                    base.get("OCRProvider", "Azure"),
            "MaxConcurrentRequests":          base.get("MaxConcurrentRequests", 3),
            "MinConfidenceThreshold":         base.get("MinConfidenceThreshold", 0.8),
            "Email": {
              "SmtpHost":                  email.get("SmtpHost"),
              "Port":                      email.get("Port", 587),
              "EnableSsl":                 email.get("EnableSsl", True),
              "SkipCertificateValidation": email.get("SkipCertificateValidation", True),
              "Username":                  email.get("Username"),
              "Password":                  os.environ["EMAIL_PASSWORD"],
              "FromAddress":               email.get("FromAddress"),
              "FromName":                  email.get("FromName", "K-OCR")
            },
            "Database": {
              "Provider": os.environ.get("DATABASE__PROVIDER", "SqlServer"),
              "ConnectionString": os.environ["DATABASE__CONNECTIONSTRING"],
              "EnableSensitiveDataLogging": False,
              "EnableDetailedErrors": False
            },
            "Stripe": {
              "SecretKey":        os.environ["STRIPE_SECRET_KEY"],
              "WebhookSecret":    os.environ["STRIPE_WEBHOOK_SECRET"],
              "MeterEventName":   os.environ["STRIPE_METER_EVENT_NAME"],
              "DefaultPriceId":   os.environ["STRIPE_DEFAULT_PRICE_ID"],
              "Prices":           stripe.get("Prices", {})
            },
            "Bootstrap": {
              "ResetIdentityDatabaseIfMissingMultiOrgMembership": False,
              "SuperAdmin": {
                "UserName": "superadmin",
                "Email": "leekirkhawley@gmail.com",
                "Password": os.environ["SUPERADMIN_PASSWORD"]
              }
            },
            "DataProtection": {
              "KeyRingXml": os.environ["DATA_PROTECTION_KEY_XML"]
            }
          }

          with open('./publish/appsettings.json', 'w') as f:
              json.dump(prod, f, indent=2)

          print("Production appsettings.json written.")
          EOF

      # Write web.config from scratch with outofprocess hosting and Production environment.
      # outofprocess works with ANCM alone; inprocess requires the full hosting bundle.
      - name: Write web.config
        run: |
          python3 << 'EOF'
          import os
          from xml.sax.saxutils import escape

          aspnetcore_environment = escape(os.environ.get("ASPNETCORE_ENVIRONMENT", "Production"))
          database_provider = escape(os.environ.get("DATABASE__PROVIDER", "SqlServer"))
          database_connection_string = escape(os.environ["DATABASE__CONNECTIONSTRING"])

          content = f'''<?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <httpErrors errorMode="Detailed" />
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet"
                            arguments=".\\KOCRAsp.dll"
                            stdoutLogEnabled="true"
                            stdoutLogFile=".\\logs\\stdout"
                            hostingModel="outofprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="{aspnetcore_environment}" />
                    <environmentVariable name="DATABASE__PROVIDER" value="{database_provider}" />
                    <environmentVariable name="DATABASE__CONNECTIONSTRING" value="{database_connection_string}" />
                    <environmentVariable name="ASPNETCORE_DETAILEDERRORS" value="true" />
                  </environmentVariables>
                  <handlerSettings>
                    <handlerSetting name="debugFile" value=".\\logs\\ancm-debug.log" />
                    <handlerSetting name="debugLevel" value="file,trace" />
                  </handlerSettings>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>'''
          with open('./publish/web.config', 'w') as f:
              f.write(content)
          print("web.config written.")
          EOF

      # Upload app_offline.htm first to signal ANCM to shut down the running app,
      # freeing file locks before the main deploy overwrites KOCRAsp.exe/dlls.
      - name: Take app offline
        run: |
          echo "<h1>Site is being updated, please check back shortly.</h1>" > app_offline.htm
          curl -s -T app_offline.htm ftp://209.58.148.243/elkmountainsoftware.com/app_offline.htm \
            --user "kirkhawley:${{ secrets.FTP_PASSWORD }}" --ftp-create-dirs
          echo "app_offline.htm uploaded, waiting for app to shut down..."
          sleep 30

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 209.58.148.243
          username: kirkhawley
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /elkmountainsoftware.com/
          state-name: .ftp-deploy-sync-state-v2.json
          # Only upload changed files; does NOT wipe the server directory
          # dangerous-clean-slate would also delete KOCRBase data — keep false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.development.user.json
            **/appsettings.Development.json

      - name: Bring app back online
        run: |
          curl -s ftp://209.58.148.243/ \
            --user "kirkhawley:${{ secrets.FTP_PASSWORD }}" \
            -Q "DELE /elkmountainsoftware.com/app_offline.htm"
          echo "app_offline.htm removed, app is back online."
