name: Deploy to kirkhawley.org

on:
  push:
    branches: [ master ]
  workflow_dispatch:   # also allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore KOCRAsp/KOCRAsp.csproj

      - name: Publish (Release, self-contained win-x64)
        run: dotnet publish KOCRAsp/KOCRAsp.csproj -c Release -r win-x64 --self-contained true -o ./publish --nologo

      # Replace appsettings.json in the publish output with production values.
      # Azure credentials are carried over from the checked-in appsettings.json.
      # Note: move AzureCognitiveServicesKey to a GitHub Secret when the repo goes public.
      - name: Write production appsettings.json
        run: |
          python3 << 'EOF'
          import json

          with open('./KOCRAsp/appsettings.json') as f:
              base = json.load(f)

          prod = {
            "AllowDuplicateEmails": True,
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "kirkhawley.org;www.kirkhawley.org",
            "Api": {
              "BaseUrl": "https://kirkhawley.org"
            },
            "Kocr": {
              "BaseDirectory": "/kirkhawley.org/KOCRBase"
            },
            "AzureCognitiveServicesKey":      base.get("AzureCognitiveServicesKey"),
            "AzureCognitiveServicesEndpoint": base.get("AzureCognitiveServicesEndpoint"),
            "OCRProvider":                    base.get("OCRProvider", "Azure"),
            "MaxConcurrentRequests":          base.get("MaxConcurrentRequests", 3),
            "MinConfidenceThreshold":         base.get("MinConfidenceThreshold", 0.8),
            "Database": {
              "IdentityConnectionString": "Data Source=/kirkhawley.org/KOCRBase/kocr.db",
              "UseWalMode": False,
              "EnableSensitiveDataLogging": False,
              "EnableDetailedErrors": False
            }
          }

          with open('./publish/appsettings.json', 'w') as f:
              json.dump(prod, f, indent=2)

          print("Production appsettings.json written.")
          EOF

      # Write web.config from scratch with outofprocess hosting and Production environment.
      # outofprocess works with ANCM alone; inprocess requires the full hosting bundle.
      - name: Write web.config
        run: |
          python3 << 'EOF'
          content = '''<?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath=".\\KOCRAsp.exe"
                            stdoutLogEnabled="true"
                            stdoutLogFile=".\\logs\\stdout"
                            hostingModel="outofprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>'''
          with open('./publish/web.config', 'w') as f:
              f.write(content)
          print("web.config written.")
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 209.58.148.243
          username: kirkhawley
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /kirkhawley.org/wwwroot/
          # Wipe server directory before uploading for a clean deployment
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.development.user.json
            **/appsettings.Development.json
